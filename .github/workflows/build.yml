name: Build iOS IPA
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'

      - name: Set up Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      # Alternate Fetch Method: Combines network retries and uses an official backup mirror path
      - name: Fetch VC Runtime Dependencies
        run: |
          mkdir -p app/Madeira/x86_64-vcruntime
          
          # Force IPv4 fallback to prevent the Mac runner from hitting broken IPv6 DNS blocks
          curl -4 -L --retry 5 --retry-delay 2 -o app/Madeira/x86_64-vcruntime/vcruntime140.dll https://githubusercontent.com
          curl -4 -L --retry 5 --retry-delay 2 -o app/Madeira/x86_64-vcruntime/msvcp140.dll https://githubusercontent.com
          
          ls -la app/Madeira/x86_64-vcruntime

      - name: Build App
        run: |
          xcodebuild -project app/Madeira.xcodeproj -scheme Madeira -configuration Release -sdk iphoneos CODE_SIGNING_ALLOWED=NO OBJROOT=$PWD/build SYMROOT=$PWD/build

      - name: Create IPA Container
        run: |
          mkdir -p Payload
          cp -r build/Release-iphoneos/Madeira.app Payload/
          zip -r Madeira.ipa Payload/

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Madeira-IPA
          path: Madeira.ipa
