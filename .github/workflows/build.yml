name: Build Unsigned IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Inject Required VC Runtime Dependencies
        run: |
          mkdir -p app/Madeira/x86_64-vcruntime
          
          # Fetch official MSVC redistributable architecture package
          curl -L -o vc_redist.arm64.exe https://aka.ms
          
          # Extract runtime engine libraries into position
          unzip -j vc_redist.arm64.exe "AttachedContainer/*" -d app/Madeira/x86_64-vcruntime/ || true
          
          # Ensure workspace target directories exist
          mkdir -p build/Madeira.app

      - name: Build Xcode Project
        run: |
          xcodebuild build \
            -project Madeira.xcodeproj \
            -scheme Madeira \
            -configuration Release \
            -sdk iphoneos \
            CONFIGURATION_BUILD_DIR=$PWD/build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            PROVISIONING_PROFILE_SPECIFIER=""

      - name: Package Binary into IPA Format
        run: |
          mkdir -p Payload
          mv build/Madeira.app Payload/
          zip -r Madeira.ipa Payload

      - name: Upload Finished IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Madeira-Unsigned-IPA
          path: Madeira.ipa
