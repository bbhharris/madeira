name: Build Unsigned IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Debug Folder Structure
        run: |
          ls -la
          find . -maxdepth 3 -type d

      - name: Build Xcode Project
        run: |
          xcodebuild build \
            -project Madeira.xcodeproj \
            -scheme Madeira \
            -configuration Release \
            -sdk iphoneos \
            CONFIGURATION_BUILD_DIR=$PWD/build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            PROVISIONING_PROFILE_SPECIFIER=""

      - name: Package Binary into IPA Format
        run: |
          mkdir -p Payload
          mv build/Madeira.app Payload/
          zip -r Madeira.ipa Payload

      - name: Upload Finished IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Madeira-Unsigned-IPA
          path: Madeira.ipa

